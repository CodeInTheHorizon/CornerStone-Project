# MarketPulse AI backend. See docs/DEPLOYMENT.md before creating this Blueprint.
# Requires an existing durable PostgreSQL DATABASE_URL; there is no local storage
# fallback in production. Keep the repository root: the backend also reads the
# bundled data/demo fixture.
# One instance and one worker: the training lock is process-local. Startup
# migrations are serialized by a PostgreSQL advisory lock regardless.
services:
  - type: web
    name: marketpulse-api
    runtime: python
    plan: free
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app.start
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SQL_ECHO
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ACCESS_LOG
        value: "false"
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_BACKEND
        value: database
      - key: STORAGE_MAX_BYTES
        value: "134217728"
